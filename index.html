<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <title>SPECIAL</title>

</head>
<body>

    <div class="container">
        <div class="instruction">Tap the Envelope</div>
        
        <div class="envelope-wrapper" id="envelope">
            <div class="wax-seal"></div>
            <div class="flap"></div>
            
            <div class="letter">
                <h2>Special Message</h2>
                <p><strong>From:</strong> Gabriel Braja Falevi</p>
                <p><strong>To:</strong> Natania Mikha Sevelin</p>
                <p>i have a special message for you🤍.
                    CLICK THE BUTTON BELOW❗❗💢
                </p>
                <a href="#" class="btn-click" id="btnSurprise">CLICK ME</a>
            </div>
        </div>
    </div>

    <script>
        const envelope = document.getElementById('envelope');
        const btnSurprise = document.getElementById('btnSurprise');

        // Menggunakan click event (masih paling stabil di mobile browser)
        envelope.addEventListener('click', function() {
            this.classList.toggle('open');
        });

btnSurprise.addEventListener('click', function(e) {
    e.stopPropagation(); // Biar amplop gak nutup lagi
    
    // Mengarahkan ke halaman baru
    window.location.href = "2.html"; 
});
    </script>
</body>
